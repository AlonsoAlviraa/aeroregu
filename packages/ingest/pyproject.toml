[project]
name = "evidence-ingest"
version = "0.1.0"
description = "Text-layer ingestion for PDF, DOCX, and XLSX."
requires-python = ">=3.12"
dependencies = [
    "docling>=2.0.0",
    "openpyxl>=3.1.5",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_ingest"]
