[project]
name = "evidence-calc"
version = "0.1.0"
description = "Pure deterministic screening methods. Decimal only."
requires-python = ">=3.12"
dependencies = [
    "pint>=0.24.4",
    "python-flint>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_calc"]
