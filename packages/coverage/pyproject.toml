[project]
name = "evidence-coverage"
version = "0.1.0"
description = "Envelope grid and gap queries."
requires-python = ">=3.12"
dependencies = [
    "evidence-calc",
    "evidence-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_coverage"]

[tool.uv.sources]
evidence-calc = { workspace = true }
evidence-kernel = { workspace = true }
