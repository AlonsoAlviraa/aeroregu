[project]
name = "evidence-eval"
version = "0.1.0"
description = "Seeded-error benchmark runner."
requires-python = ">=3.12"
dependencies = [
    "evidence-calc",
    "evidence-ingest",
    "evidence-kernel",
    "pypdf>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_eval"]

[tool.uv.sources]
evidence-calc = { workspace = true }
evidence-ingest = { workspace = true }
evidence-kernel = { workspace = true }
