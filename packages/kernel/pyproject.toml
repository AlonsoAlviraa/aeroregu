[project]
name = "evidence-kernel"
version = "0.1.0"
description = "Public-safe ledger, hashes, supervisor, and model gateway."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "cvc5>=1.4.2",
    "evidence-calc",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "llguidance>=1.9.1",
    "pydantic>=2.10.0",
    "rfc8785>=0.1.4",
    "z3-solver>=5.4.1.0",
]

[tool.uv.sources]
evidence-calc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_kernel"]
