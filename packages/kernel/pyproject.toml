[project]
name = "evidence-kernel"
version = "0.1.0"
description = "Public-safe ledger, hashes, supervisor, and model gateway."
requires-python = ">=3.12"
dependencies = [
    "evidence-calc",
    "jsonschema>=4.23.0",
    "pydantic>=2.10.0",
]

[tool.uv.sources]
evidence-calc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_kernel"]
