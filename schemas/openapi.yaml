components:
  schemas:
    Envelope:
      type: object
      required: [sources, method_version, inputs_hash, confidence, abstain]
      properties:
        sources:
          type: array
          items:
            type: object
        method_version:
          type: string
        inputs_hash:
          type: string
        confidence:
          type: string
          enum: [deterministic, quoted, draft, abstain]
        result:
          nullable: true
        abstain:
          nullable: true
