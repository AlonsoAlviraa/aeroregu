openapi: 3.0.3
info:
  title: aeroregu
  version: 0.1.0
  description: >
    This tool assists a human reviewer. It does not determine compliance.
    Screening illustration only. No authority acceptance is claimed.
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Envelope with gateway name. Fixture when MODEL_BASE_URL is unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ingest/document:
    post:
      operationId: ingestDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                content_text:
                  type: string
                content_base64:
                  type: string
                record:
                  type: boolean
                tenant_id:
                  type: string
                actor_id:
                  type: string
      responses:
        "200":
          description: Unified document ingestion result (PDF, DOCX, XLSX, TXT/MD) with blocks, requirement spans, and optional ledger receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /calc/run:
    post:
      operationId: calcRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method_id, inputs]
              properties:
                method_id:
                  type: string
                inputs:
                  type: object
                  additionalProperties: true
                normalize_units:
                  type: boolean
                record:
                  type: boolean
                tenant_id:
                  type: string
      responses:
        "200":
          description: Deterministic envelope, or abstain with no result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /calc/compare:
    post:
      operationId: calcCompare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method_id, inputs, stated_outputs]
              properties:
                method_id:
                  type: string
                inputs:
                  type: object
                  additionalProperties: true
                stated_outputs:
                  type: object
                  additionalProperties: true
                normalize_units:
                  type: boolean
      responses:
        "200":
          description: Compare stated outputs with deterministic recomputation and root-cause fault flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/append:
    post:
      operationId: ledgerAppend
      responses:
        "200":
          description: Envelope whose result carries the new event hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/verify:
    get:
      operationId: ledgerVerify
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Verify append-only hash chain and return current head hash and Merkle root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/events:
    get:
      operationId: ledgerEvents
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: event_type
          schema:
            type: string
        - in: query
          name: actor_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Query paginated and filtered ledger events for a tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/consistency:
    get:
      operationId: ledgerConsistency
      parameters:
        - in: query
          name: old_count
          schema:
            type: integer
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: O(log N) Merkle append-only consistency proof from old_count to current count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/proof/{event_hash}:
    get:
      operationId: ledgerProof
      parameters:
        - in: path
          name: event_hash
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: O(log N) Merkle inclusion proof for the specified event hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /ledger/signoff:
    post:
      operationId: ledgerSignoff
      responses:
        "200":
          description: Record a human sign-off event against a ledger event hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/gaps:
    get:
      operationId: coverageGaps
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Gap query. A gap is the absence of a closing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/cells:
    get:
      operationId: coverageCells
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: stale_only
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Paginated list of coverage cells with computed status and staleness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/sweep:
    post:
      operationId: coverageSweep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                target_status:
                  type: string
                stale_only:
                  type: boolean
                limit:
                  type: integer
      responses:
        "200":
          description: Batch deterministic verification sweep across coverage cells.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/gate:
    get:
      operationId: coverageGate
      parameters:
        - in: query
          name: require_signoff
          schema:
            type: boolean
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: OpenFastTrace-style traceability and re-verification gate report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/cell-status:
    post:
      operationId: coverageCellStatus
      responses:
        "200":
          description: Authenticated human status assignment for a coverage grid cell.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/mass-shift:
    post:
      operationId: coverageMassShift
      responses:
        "200":
          description: Invalidate covered cells under a +5% mass shift and emit delta manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /dossier/summary:
    get:
      operationId: dossierSummary
      responses:
        "200":
          description: Enterprise certification lineage graph and delta re-verification manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /dossier/strictdoc:
    get:
      operationId: dossierStrictDoc
      responses:
        "200":
          description: StrictDoc (.sdoc) airworthiness requirements and evidence matrix.
          content:
            text/plain:
              schema:
                type: string
  /dossier/oscal:
    get:
      operationId: dossierOscal
      responses:
        "200":
          description: NIST OSCAL Assessment Results (SAR) airworthiness evaluation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /formal/prove:
    post:
      operationId: formalProve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [flight_envelope, structural_margin, hover_power]
                tenant_id:
                  type: string
                bounds:
                  type: object
                safety_factor:
                  type: string
                allowables:
                  type: object
                disk_area_m2:
                  type: string
                air_density_kg_m3:
                  type: string
                figure_of_merit:
                  type: string
                max_power_available_kw:
                  type: string
      responses:
        "200":
          description: SMT formal verification receipt with exact rational proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /agents/runtime:
    get:
      operationId: agentsRuntime
      responses:
        "200":
          description: Agent registry, prompt hashes, API/Edge backend readiness, and Edge hardware presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /agents/probe:
    post:
      operationId: agentsProbe
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [all, api, edge]
                timeout_s:
                  type: number
      responses:
        "200":
          description: Probe configured API and Edge model endpoints for availability and models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /agents/edge/preflight:
    post:
      operationId: agentsEdgePreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edge_preset:
                  type: string
                text:
                  type: string
                blocks:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Deterministic CPU pre-screening and span-preserving context compaction for Edge SLMs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /agents/invoke:
    post:
      operationId: agentsInvoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  enum: [reader, checker, refuter, scribe, decision_gate]
                text:
                  type: string
                runtime_mode:
                  type: string
                  enum: [auto, fixture, api, edge, hybrid]
                model:
                  type: string
                edge_model:
                  type: string
                edge_preset:
                  type: string
                compact_for_edge:
                  type: boolean
                record:
                  type: boolean
                tenant_id:
                  type: string
      responses:
        "200":
          description: Invoke a single verification agent with schema, numeric, and safety guards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /supervisor/run:
    post:
      operationId: supervisorRun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runtime_mode:
                  type: string
                  enum: [auto, fixture, api, edge, hybrid]
                model:
                  type: string
                edge_model:
                  type: string
                edge_preset:
                  type: string
                compact_for_edge:
                  type: boolean
                max_schema_retries:
                  type: integer
                tenant_id:
                  type: string
      responses:
        "200":
          description: Supervisor graph result. Abstain omits result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /supervisor/stream:
    post:
      operationId: supervisorStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runtime_mode:
                  type: string
                  enum: [auto, fixture, api, edge, hybrid]
                model:
                  type: string
                edge_model:
                  type: string
                edge_preset:
                  type: string
                compact_for_edge:
                  type: boolean
                max_schema_retries:
                  type: integer
                tenant_id:
                  type: string
      responses:
        "200":
          description: Server-Sent Events stream of per-stage and per-agent verification updates.
          content:
            text/event-stream:
              schema:
                type: string
  /notes/check:
    post:
      operationId: notesCheck
      responses:
        "200":
          description: Recompute a note. Missing inputs abstain with no numeric result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /requirements:
    get:
      operationId: requirements
      responses:
        "200":
          description: Requirement identifiers. Titles without a hashed local file are NOT_VERIFIED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /aircraft:
    get:
      operationId: aircraft
      responses:
        "200":
          description: Synthetic aircraft record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /:
    get:
      operationId: workbenchIndex
      responses:
        "200":
          description: Interactive Calculation & Verification Studio HTML workbench.
          content:
            text/html:
              schema:
                type: string
  /export/zip:
    post:
      operationId: exportZip
      responses:
        "200":
          description: Zip of the hash chain plus a verifier command.
  /attestation/public-key:
    get:
      operationId: attestationPublicKey
      responses:
        "200":
          description: DSSE Ed25519 public key in PEM format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /metrics/pilot:
    get:
      operationId: pilotMetrics
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Signed engineering review velocity metrics and ledger counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /mcp:
    post:
      operationId: mcpRpc
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                id:
                  nullable: true
                method:
                  type: string
                params:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Model Context Protocol (MCP) JSON-RPC 2.0 response.
  /auth/login:
    post:
      operationId: login
      responses:
        "200":
          description: Local or production session cookie (HttpOnly, SameSite=Lax, Secure under TLS/prod).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Revoke current session token and clear el_session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /auth/me:
    get:
      operationId: authMe
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Authenticated actor identity, tenant, and role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /cad/ingest:
    post:
      operationId: cadIngest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                content_text:
                  type: string
                content_base64:
                  type: string
                auto_run:
                  type: boolean
                stated_outputs:
                  type: object
                tenant_id:
                  type: string
                record:
                  type: boolean
      responses:
        "200":
          description: Parsed STEP AP242, IGES, CATIA XML/.CATPart/.CATProduct, NASTRAN .bdf/.dat, or ABAQUS .inp model plus Knowledgeware/FEM card bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /cad/bind:
    post:
      operationId: cadBind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parameters]
              properties:
                parameters:
                  type: array
                  items:
                    type: object
                formulas:
                  type: array
                  items:
                    type: object
                auto_run:
                  type: boolean
                stated_outputs:
                  type: object
      responses:
        "200":
          description: Automatic deterministic bindings from CAD/CAE Knowledgeware parameters to verified calculation cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /coverage/envelope-3d:
    get:
      operationId: coverageEnvelope3dGet
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: wing_area_m2
          schema:
            type: string
        - in: query
          name: v_c_mps
          schema:
            type: string
        - in: query
          name: v_d_mps
          schema:
            type: string
        - in: query
          name: nz_max
          schema:
            type: string
        - in: query
          name: nz_min
          schema:
            type: string
      responses:
        "200":
          description: Deterministic 3D V-n flight envelope surface and [X_cg, Y_cg, Z_cg] CG cloud dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: coverageEnvelope3dPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                cad_cg_points:
                  type: array
                  items:
                    type: object
                mass_kg_override:
                  type: string
                wing_area_m2:
                  type: string
                v_c_mps:
                  type: string
                v_d_mps:
                  type: string
                nz_max:
                  type: string
                nz_min:
                  type: string
                cg_limits_m:
                  type: object
                fem_overlay:
                  type: object
      responses:
        "200":
          description: Custom 3D V-n flight envelope merged with CAD/FEM CG points and mesh overlay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /calc/cards:
    get:
      operationId: calcCardsList
      responses:
        "200":
          description: List built-in and custom declarative calculation method cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: calcCardsRegister
      responses:
        "200":
          description: Register or update a declarative calculation plugin card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /calc/cards/{method_id}:
    delete:
      operationId: calcCardsDelete
      parameters:
        - in: path
          name: method_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete a custom declarative calculation plugin card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /sso/oidc/callback:
    post:
      operationId: ssoOidcCallback
      responses:
        "200":
          description: Verify corporate OIDC ID token (Entra ID / Okta) and issue a signed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /sso/saml/acs:
    post:
      operationId: ssoSamlAcs
      responses:
        "200":
          description: Verify corporate SAML 2.0 assertion (X.509 signed) and issue a signed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /admin/roles:
    get:
      operationId: adminRolesList
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: List actors and RBAC roles (author, cve, admin) for a tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: adminRolesSet
      responses:
        "200":
          description: Assign an RBAC role (author, cve, admin, human) to a tenant actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /blobs:
    get:
      operationId: blobsList
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: prefix
          schema:
            type: string
      responses:
        "200":
          description: List large CAD/specification blobs stored in Object Storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: blobsPut
      responses:
        "200":
          description: Upload a CAD/specification binary blob (base64) to S3 or filesystem Object Storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /blobs/{sha256_hex}:
    get:
      operationId: blobsGet
      parameters:
        - in: path
          name: sha256_hex
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Download stored binary blob by SHA-256 digest.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /webhooks:
    get:
      operationId: webhooksList
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: List CI/CD webhooks and recent HMAC delivery telemetry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: webhooksRegister
      responses:
        "200":
          description: Register an SSRF-validated CI/CD webhook subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /webhooks/{webhook_id}:
    delete:
      operationId: webhooksDelete
      parameters:
        - in: path
          name: webhook_id
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          schema:
            type: string
      responses:
        "200":
          description: Delete a CI/CD webhook subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /dossier/pdf:
    get:
      operationId: dossierPdfDownload
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: enforce_distinct
          schema:
            type: boolean
      responses:
        "200":
          description: Signed PDF audit dossier with visual bbox evidence thumbnails and offline QR code.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /dossier/pdf/verify:
    post:
      operationId: dossierPdfVerify
      responses:
        "200":
          description: Offline-verify embedded Ed25519 DSSE signature inside a signed PDF dossier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /static/viewer3d.js:
    get:
      operationId: viewer3dScript
      responses:
        "200":
          description: Air-gapped WebGL/Three.js interactive 3D V-n and CG cloud viewer module.
          content:
            application/javascript:
              schema:
                type: string
  /static/q4_ux_modules.js:
    get:
      operationId: q4UxModulesScript
      responses:
        "200":
          description: Interactive Q2-Q4 frontend UX controllers (dynamic 32+ methods, MMPDS/CMH-17 materials, FEA binary, PDF+BBox, PLM/ECN/Review/QES).
          content:
            application/javascript:
              schema:
                type: string
  /static/quotation_cockpit.js:
    get:
      operationId: quotationCockpitScript
      responses:
        "200":
          description: Interactive Year-1 Q1-Q4 helicopter multi-archetype quotation cockpit UI controller.
          content:
            application/javascript:
              schema:
                type: string
  /metrics:
